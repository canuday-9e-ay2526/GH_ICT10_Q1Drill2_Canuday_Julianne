<!DOCTYPE html>
<html lang="en">
<head>
        <!-- Recommended meta tags -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <!-- PyScript CSS -->
        <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
        <!-- This script tag bootstraps PyScript -->
        <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
      
        <!-- GOOGLE FONT -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
        <title>Working with Numbers</title>    
</head>
<body>
    <div class="container" style="background-image: url(math.png); background-color: (89, 122, 122); text-align: center; padding: 15px">
    <form style="background-color: rgb(0, 0, 0); color: rgb(45, 99, 81); border-radius: 15px; padding: 15px">
        <input type="number" id="num1" placeholder="Enter first number" style="background-color: antiquewhite; color: rgb(45, 99, 81); font-size: 30px; font-family: 'Saira', sans-serif; text-align: center;"><br>
        <input type="number" id="num2" placeholder="Enter second number" style="background-color: antiquewhite; color: rgb(45, 99, 81); font-size: 30px ; font-family: 'Saira', sans-serif;text-align: center;"><br><br><hr>

        <input type="button" py-click="adding_numbers" value="Add" style="background-color: antiquewhite; color: rgb(45, 99, 81); font-size: 20px; border-radius: 15px ; font-family: 'Saira', sans-serif;">
        <input type="button" py-click="subtracting_numbers" value="Subtract" style="background-color: antiquewhite; color: rgb(45, 99, 81); font-size: 20px; border-radius: 15px ; font-family: 'Saira', sans-serif;">
        <input type="button" py-click="multiplying_numbers" value="Multiply" style="background-color: antiquewhite; color: rgb(45, 99, 81); font-size: 20px; border-radius: 15px; ; font-family: 'Saira', sans-serif;">
        <input type="button" py-click="exponentiating_numbers" value="Exponentiate" style="background-color: antiquewhite; color: rgb(45, 99, 81); font-size: 20px; border-radius: 15px; font-family: 'Saira', sans-serif;">
        <input type="button" py-click="dividing_numbers" value="Divide" style="background-color: antiquewhite; color: rgb(45, 99, 81); font-size: 20px; border-radius: 15px ; font-family: 'Saira', sans-serif;">
        <input type="button" py-click="floordiv_numbers" value="Floor Divide" style="background-color: antiquewhite; color: rgb(45, 99, 81); font-size: 20px ; border-radius: 15px; font-family: 'Saira', sans-serif;">
        <input type="button" py-click="modulo_numbers" value="Modulo" style="background-color: antiquewhite; color: rgb(45, 99, 81); font-size: 20px; border-radius: 15px; font-family: 'Saira', sans-serif;">

   
    </form>
    <br>
    <div id="result" style="background-color: antiquewhite; color: rgb(45, 99, 81); font-size: 30px"></div>

    </div>
    <py-script src="main.py"></py-script>
</body>
</html>
